name: Build empty Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract project
        shell: bash
        run: |
          unzip -q -o MySecureApp-GitHub-ready.zip -d extracted
          unzip -q -o extracted/MySecureApp-source.zip -d .
          test -f app/build.gradle
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          echo "sdk.dir=$SDK_DIR" > local.properties
          set +o pipefail
          yes | "$SDK_MANAGER" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;35.0.0"

      - name: Build APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MySecureApp-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
